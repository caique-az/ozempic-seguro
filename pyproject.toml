[project]
name = "ozempic-seguro"
version = "1.3.4"
description = "Sistema de gerenciamento de gavetas para controle seguro de medicamentos termolábeis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Caique Azevedo", email = "caiqueazevedo2005@gmail.com"}
]
requires-python = ">=3.13"
keywords = ["medicamentos", "controle", "segurança", "desktop", "customtkinter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment",
]

dependencies = [
    "customtkinter==5.2.2",
    "Pillow>=10.3,<12",
    "bcrypt==4.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[project.urls]
Homepage = "https://github.com/CaiqueAzevedo65/Projeto-Ozempic-Seguro"
Repository = "https://github.com/CaiqueAzevedo65/Projeto-Ozempic-Seguro.git"

[project.scripts]
ozempic-seguro = "ozempic_seguro.main:main"

[build-system]
requires = ["setuptools>=61.0", "wheel", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "src/ozempic_seguro/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"
fallback_version = "1.3.4"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/ozempic_seguro/_version.py"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "PTH",    # flake8-use-pathlib
    "T20",    # flake8-print
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by the formatter)
    "B008",   # function call in default argument
    "B026",   # star-arg after keyword arg (unavoidable in CustomTkinter super().__init__)
]

# Emoji used as icons in the UI
allowed-confusables = ["ℹ", "➕"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["ozempic_seguro"]

[tool.mypy]
python_version = "3.13"
files = ["src/ozempic_seguro"]
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# CustomTkinter ships without type hints, so its widgets are typed as Any.
module = "ozempic_seguro.presentation.*"
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--cov=ozempic_seguro",
    "--cov-report=term-missing:skip-covered",
    "--tb=short",
]
markers = [
    "ui: renders real Tk windows; skipped automatically when no display is available",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["ozempic_seguro"]
branch = true
omit = [
    # The UI is exercised by the smoke tests in tests/presentation, which only run where
    # a display exists, so it is left out of the threshold to keep it stable across CI runners.
    "*/ozempic_seguro/presentation/*",
    "*/ozempic_seguro/main.py",
    "*/ozempic_seguro/__main__.py",
    "*/ozempic_seguro/_version.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    # Ports are interface declarations; their bodies never run.
    'class .*\(Protocol\):',
    '^\s*\.\.\.$',
]
