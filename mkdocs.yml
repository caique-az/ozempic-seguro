site_name: Ozempic Seguro
site_description: Controle de acesso a gavetas de medicamentos termolábeis
site_url: https://caique-az.github.io/ozempic-seguro/
repo_url: https://github.com/caique-az/ozempic-seguro
repo_name: caique-az/ozempic-seguro
edit_uri: edit/main/docs/
copyright: MIT © Caique Azevedo

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-night
        name: Tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Tema claro
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight

nav:
  - Início: index.md
  - Primeiros passos: primeiros-passos.md
  - Produto:
      - Regras de negócio: regras-de-negocio.md
      - Casos de uso: casos-de-uso.md
  - Engenharia:
      - Arquitetura: arquitetura.md
      - Dados e migrações: dados.md
      - Desenvolvimento: desenvolvimento.md
  - Decisões (ADRs):
      - adr/index.md
      - adr/0001-arquitetura-em-camadas.md
      - adr/0002-desativar-usuarios.md
      - adr/0003-estado-sem-threads.md
      - adr/0004-auditoria-de-gavetas.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang: pt
